# Publica a apresentação (apresentacao/) no GitHub Pages.
# O deck fica servido na raiz do site: espacial.html vira index.html.
name: Publicar slides no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apresentacao/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Montar o site
        run: |
          mkdir _site
          cp -r apresentacao/. _site/
          # O deck é a página inicial do site.
          mv _site/espacial.html _site/index.html
          # Arquivos não referenciados pelo deck (inclui a fonte PNG de 8,4 MB
          # do fundo, substituída por visao_floresta_05.jpg).
          rm -f _site/images/visao_floresta_05.png \
                _site/images/mastodon_gd.png \
                _site/images/python-logo-transparent.png

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
